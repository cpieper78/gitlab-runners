name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  validate:
    # Static checks that need no AWS creds. Always runs.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  plan:
    # Skipped on first-time setup until AWS_OIDC_ROLE_ARN is configured —
    # see README "Prerequisites" for the one-time AWS IAM OIDC role setup.
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_OIDC_CONFIGURED == 'true' }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        env:
          TF_VAR_gitlab_runner_token: ${{ secrets.GITLAB_RUNNER_TOKEN }}
          TF_VAR_session_server_hostname: ${{ vars.SESSION_SERVER_HOSTNAME }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
          TF_VAR_gitlab_project_path: ${{ vars.GITLAB_PROJECT_PATH }}
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan | tee plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const max = 60_000;
            let body = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (body.length > max) {
              body = body.slice(0, max) + '\n\n... (truncated)';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '```\n' + body + '\n```',
            });
