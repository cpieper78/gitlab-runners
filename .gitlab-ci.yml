# Mirror-of-GitHub Terraform pipeline. Runs on MRs that touch terraform/.
# Auths to AWS via GitLab OIDC; needs CI/CD variables:
#   AWS_ROLE_ARN  (read-only IAM, sufficient for terraform plan)
#   AWS_REGION    (e.g. us-east-1)
# Variables (regular, non-secret) needed by the plan:
#   TF_VAR_session_server_hostname
#   TF_VAR_route53_zone_id
#   TF_VAR_gitlab_project_path
# Optional overrides for the list-typed required vars below (the defaults set
# in `variables:` are TEST-NET placeholders, so plan runs out of the box):
#   TF_VAR_session_server_source_cidrs            (JSON list, e.g. '["1.2.3.0/24"]')
#   TF_VAR_cluster_endpoint_public_access_cidrs   (JSON list, e.g. '["1.2.3.0/24"]')
# Secret (masked):
#   TF_VAR_gitlab_runner_token

stages:
  - validate
  - plan

default:
  image:
    name: hashicorp/terraform:1.9.5
    entrypoint: [""]
  before_script:
    - apk add --no-cache aws-cli bash
    - cd terraform

variables:
  TF_IN_AUTOMATION: "true"
  # Safe placeholder JSON for required list-typed vars so plan is runnable
  # before project-level CI/CD variables are configured. Override in the
  # GitLab UI under Settings > CI/CD > Variables when ready.
  TF_VAR_session_server_source_cidrs: '["203.0.113.0/24"]'
  TF_VAR_cluster_endpoint_public_access_cidrs: '["203.0.113.0/24"]'

.aws_oidc: &aws_oidc
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache aws-cli bash jq
    - >
      creds=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-ci-$CI_JOB_ID"
      --web-identity-token "$AWS_ID_TOKEN"
      --duration-seconds 3600
      --output json)
    - export AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r '.Credentials.AccessKeyId')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r '.Credentials.SecretAccessKey')
    - export AWS_SESSION_TOKEN=$(echo "$creds" | jq -r '.Credentials.SessionToken')
    - cd terraform

fmt:
  stage: validate
  script:
    - terraform fmt -check -recursive ..
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["terraform/**/*", ".gitlab-ci.yml"]

validate:
  stage: validate
  script:
    - terraform init -backend=false -input=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["terraform/**/*", ".gitlab-ci.yml"]

plan:
  stage: plan
  <<: *aws_oidc
  script:
    - terraform init -input=false
    - terraform plan -no-color -input=false -out=tfplan | tee plan.txt
  artifacts:
    when: always
    paths:
      - terraform/plan.txt
      - terraform/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["terraform/**/*", ".gitlab-ci.yml"]
